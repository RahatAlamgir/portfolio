<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0A0B0D">
  <title>Page not found — Md Rahat Alamgir</title>
  <style>
    /* Self-contained: this page can be served from any path, so it links to nothing relative. */
    :root { --bg: #0A0B0D; --text: #F2F4F7; --muted: #97A0AD; --accent: #2DD4BF; --on-accent: #0B0D0A; }
    [data-theme="light"] { --bg: #F6F4EE; --text: #14130F; --muted: #5F5B50; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      background: var(--bg); color: var(--text);
      font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif; line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    main { max-width: 520px; text-align: center; }
    .code {
      margin: 0; font-family: "JetBrains Mono", ui-monospace, Consolas, monospace; font-size: 13px;
      color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase;
    }
    h1 { margin: 12px 0 0; font-size: clamp(64px, 18vw, 128px); line-height: 1; letter-spacing: -0.04em; }
    h1 span { color: var(--accent); }
    .msg { margin: 16px 0 0; color: var(--muted); font-size: 18px; }
    a.btn {
      display: inline-flex; align-items: center; height: 48px; margin-top: 32px; padding: 0 24px;
      border-radius: 10px; background: var(--accent); color: var(--on-accent);
      font-weight: 600; text-decoration: none; transition: opacity 0.2s ease, transform 0.15s ease;
    }
    a.btn:hover { opacity: 0.9; transform: translateY(-1px); }
    a.btn:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
    @media (prefers-reduced-motion: no-preference) {
      main { animation: in 0.6s cubic-bezier(0.22, 1, 0.36, 1) both; }
      @keyframes in { from { opacity: 0; transform: translateY(16px); } }
      h1 span { animation: blink 1.2s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0.25; } }
    }
  </style>
  <script>
    // Honour the saved theme, and find the site root (GitHub Pages project sites live under /repo-name/).
    var base = "/";
    try {
      var saved = localStorage.getItem("theme");
      if (saved === "light" || saved === "dark") document.documentElement.setAttribute("data-theme", saved);
      if (location.hostname.slice(-10) === ".github.io") base = "/" + (location.pathname.split("/")[1] || "") + "/";
    } catch (e) {}
    document.addEventListener("DOMContentLoaded", function () {
      document.getElementById("home").setAttribute("href", base);
    });
  </script>
</head>
<body>
  <main>
    <p class="code">Error 404</p>
    <h1>4<span>0</span>4</h1>
    <p class="msg">Game over: this page doesn't exist, or it has moved. Press start to head back to the portfolio.</p>
    <a class="btn" id="home" href="/">Back to portfolio</a>
  </main>
</body>
</html>
